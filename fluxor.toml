# Kagi project config consumed by the `fluxor` CLI.

# Project identity. Required for `fluxor publish`; downstream projects
# (chronicle pipelines embedding token_mint, for instance) reference kagi
# by this name.
[project]
name    = "kagi"
version = "0.0.1"

# Cross-project dependencies. Resolves to fluxor's published source
# crates and fmod palette via the local registry. PIC modules in
# `modules/app/*/mod.rs` consume the materialised SDK source at
# `target/fluxor/fluxor-abi/sdk/<file>.rs` (populated by `fluxor sync`).
[dependencies]
fluxor = "0.0.1"
# wave publishes the protocol-module palette. `configs/e2e-*.yaml` have
# always named `http` and `ws_stream`, but without the dependency they could
# not resolve — so every runtime e2e soft-skipped, and a gate that skips is
# a gate that reports green over an untested graph.
wave = "0.0.1"
# lattice provides `lattice_data_client`, the compute-side half of the
# ledger's replicated backend, reached when a graph declares
# `security_state` with `backend: lattice`.
lattice = "0.0.1"

[ci]
# Module targets to build in CI phase 3. `bcm2712` `.fmod` artefacts run
# as PIC on linux/aarch64 (the issuer + the e2e harness); `wasm` builds
# the browser secret-store backend. Modules whose `hardware_targets`
# exclude a target are skipped for it (token_mint is bcm2712-only).
targets = ["bcm2712", "wasm"]


# No `[ci.cargo] host_tools_crate`: kagi has no root cargo manifest. Its
# shared sources are `modules/common/**`, a SOURCE TREE rather than a
# crate, and the host suites under `tests/harness` mount them — one
# source, two compilations. Phase 4's built-in `cargo-test (harness)`
# runs them after the module build.

[ci.hygiene]
# Tiers where inline tests are banned. `modules/**` is no_std PIC and
# cannot host a std test harness; its units are host suites under
# `tests/harness`, which `#[path]`-mount `modules/common/**`.
forbid_inline_tests = ["modules"]
mode = "strict"
max_inline_lines = 80

# Crate-root `#![allow(...)]` is otherwise refused, because it suppresses a
# lint for everything in the file including code written later. These two
# prefixes are the case where there is no item to move the attribute onto,
# because the code the lint fires about is not in the file.
#
# Every module here is a MOUNT POINT. A PIC module `include!`s the whole
# fluxor SDK and a `#[path]` fragment is compiled into several modules at
# once; each compilation therefore sees a surface larger than it uses, and
# the unused half is a different half every time. `#[expect]` cannot express
# that — it is an error wherever the lint does not fire, which for a shared
# fragment is most of its consumers.
#
# This is scoped as tightly as a path prefix can be. Nothing under it is a
# suppression whose cause is local: the ABI entry points that dereference
# runtime-owned pointers carry `#[expect(clippy::not_unsafe_ptr_arg_deref)]`
# on the function itself.
[[ci.hygiene.allow_crate_root]]
prefix = "modules/"
reason = """PIC modules mount the SDK wholesale via include! and the common fragments by #[path], so each compile sees the entire surface and uses a subset."""

[[ci.hygiene.allow_crate_root]]
prefix = "tests/harness/tests/support/"
reason = """Each e2e suite mounts this support module by #[path] and drives only the part of the graph it tests, so every compile leaves a different part unused."""

[ci.test]
# Shadow-checkout hard-fail guard: tests/ and configs/ live in
# .git-shadow/, so a primary-only checkout cannot run the test suite or
# render the deployment graph templates. The guard fails CI instead.
scripts = ["tools/ci-shadow-guard.sh", "tools/ci-e2e-required.sh", "tools/ci-docs-coherence.sh"]

[ci.templates]
dir = "configs"
# Defaults for the template-render gate (CI phase 1.5). Just enough to
# make every template render without leftover `__KEY__` placeholders —
# not production values.
vars = { NODE_ID = "0", HTTP_PORT = "18080", WS_PORT = "19700", TOKEN_PORT = "18081", GATE_PORT = "18083", ENROL_PORT = "18084", TENANT_SEED = "render-only-not-a-secret", WELLKNOWN_PORT = "18085", CA_PEM = "render-only", E2EE_PORT = "18086", PKI_PORT = "18090", ISSUER_CN = "render-only", TRUST_DOMAIN = "render.invalid", ISSUER = "https://issuer.invalid", MAIL_FROM = "enrol@issuer.invalid", MAIL_HELO = "issuer.invalid", SMTP_AUTHORITY = "127.0.0.1:7649", CONTROL_CERT = "render-only.pem", CONTROL_KEY = "render-only.key", CONTROL_TRUST = "render-only-ca.pem", CONTROL_SVID = "", CUSTODY_POSTURE = "development", LATTICE_PORT = "7501", LATTICE_PORT2 = "7502", LATTICE_PORT3 = "7503", LATTICE_EPOCH = "1" }

[required]
# Optional wire-ABI assertion (defence in depth). The authoritative
# ABI is derived from the resolved fluxor version in `[dependencies]`;
# this pin makes drift fail the version-skew phase of `fluxor ci`
# explicitly.
fluxor = { abi = 1 }
