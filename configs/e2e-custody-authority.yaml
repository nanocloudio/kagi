# The continuity authority a Fluxor TRANSPORT_CONTINUITY provider asks, as a
# module in a Linux graph: `custody_authority` over the durable identity
# ledger (`security_state`, its grants' single-use state under
# `kagi/transfer-grants/`), its grant key a vault label.
#
#   mux ch0 ⇄ custody_authority.auth_in / auth_out     the provider's auth_req / auth_rsp
#   mux ch1 → custody_authority.signing_key            MSG_KEY_ADD (a vault label)
#   mux ch2 ⇄ custody_authority.token_out / token_in   Clustor's session directory
#   custody_authority.grant_out → mux ch3              every KTGR granted (0x4B)
#   custody_authority.ledger_out / ledger_in ⇄ security_state
#
# The suite (tests/harness/tests/custody_authority_e2e.rs) plays the provider
# and the directory over the websocket control carrier. The standby host
# enrolled as dest0 is `d7…d7` under the identity key whose private scalar is
# 0x44 repeated (the suite signs its evidence with it).
target: linux

tick_us: 500

scheduler:
  accept_cycles: true

platform:
  net: {}

modules:
  - name: custody_authority
    host: "51515151515151515151515151515151"
    iss: "__ISSUER__"
    posture: development
    ttl_ms: 30000
    dest0: "d7d7d7d7d7d7d7d7d7d7d7d7d7d7d7d7:045b36890dacbd7c9a96bb74a1ee28b3d2d75b72e09a20ef25cf8e6fd8a9f0350d0e14bed8d4682a34d83538bdff5b96e89a6666ec0db5745d02fa1210072df75a"

  - name: security_state
    authority: "single-node"

  - name: mux
    type: remote_channel
    channels: "OctetStream:tlv16:4096;OctetStream:tlv16:512;OctetStream:tlv16:4096;OctetStream:tlv16:4096"
    require_peer: 0

  - name: ws
    type: ws_net

  - name: http
    port: __WS_PORT__
    routes:
      - path: "/ws"
        websocket_fanout: true
        retain_replay: false
      - path: "/healthz"
        body: "ok"
        content_type: "text/plain"

wiring:
  - from: linux_net.net_out
    to: http.net_in
  - from: http.net_out
    to: linux_net.net_in

  - from: ws.tx_out
    to: http.ws_in
    buffer_group: 1
  - from: http.ws_out
    to: ws.rx_in
    buffer_group: 2
  - from: http.ws_event_out
    to: ws.event_in
  - from: ws.net_out
    to: mux.transport_in
  - from: mux.transport_out
    to: ws.net_in

  - from: mux.ch0_rx
    to: custody_authority.auth_in
  - from: custody_authority.auth_out
    to: mux.ch0

  - from: mux.ch1_rx
    to: custody_authority.signing_key

  - from: custody_authority.token_out
    to: mux.ch2
  - from: mux.ch2_rx
    to: custody_authority.token_in

  - from: custody_authority.grant_out
    to: mux.ch3

  - from: custody_authority.ledger_out
    to: security_state.requests
  - from: security_state.replies
    to: custody_authority.ledger_in
