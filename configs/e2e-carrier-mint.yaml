# `carrier_mint` feeding a requester: the holder of a vault-born identity
# minting the cert-bound carriers Kagi's `service_dns_sign` admits a
# publisher on — the shape the traffic fabric's `dns_sign_relay` consumes them in.
#
#   carrier_mint.identity_req  → mux ch0   [0x5B][len = 65][SEC1 point]: the
#                                          minter's vault key, to certify
#   mux ch1 → carrier_mint.identity_cert   [0x5C][len][leaf DER ‖ CA DER]
#   carrier_mint.carrier_out   → mux ch2   [len u16 LE][compact JWS], a byte
#                                          stream (one on certification, then
#                                          one every period_ms)
#   mux ch3 ⇄ service_dns_sign.signing_key / key_announce
#   mux ch4 → service_dns_sign.ca_key      the CA's key (VERIFY MSG_KEY_ADD)
#   dns_http (__HTTP_PORT__) POST /service-dns/sign → service_dns_sign
#
# The suite (tests/harness/tests/carrier_mint_e2e.rs) is the enrolment
# authority — it certifies whatever point arrives on ch0 as host
# 5a5a…5a — and the requester: each carrier off ch2 goes into a REQUEST 0x98
# beside a projection for service 3333…33, which `publisher_1` pins to that
# host. In a traffic-fabric graph `carrier_out` is wired to
# `dns_sign_relay.carrier_in`, `identity_req` / `identity_cert` to the
# cell's enrolment path, and the relay is the requester.
#
# The harness renders `__WS_PORT__`, `__HTTP_PORT__`, `__ISSUER__` and
# `__TRUST_DOMAIN__`.
target: linux

tick_us: 500

scheduler:
  accept_cycles: true

platform:
  net: {}

modules:
  - name: carrier_mint
    identity_label: "kagi/test/carrier-mint/identity"
    audience: "kagi:service-dns"
    lifetime_s: 60
    period_ms: 1000

  - name: service_dns_sign
    iss: "__ISSUER__"
    trust_domain: "__TRUST_DOMAIN__"
    audience: "kagi:service-dns"
    posture: development
    publisher_1: "host:5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a:33333333333333333333333333333333"

  - name: mux
    type: remote_channel
    channels: "OctetStream:tlv16:512;OctetStream:tlv16:4096;OctetStream:bytes:4096;OctetStream:tlv16:512;OctetStream:tlv16:512"
    # The transport is trusted as wired; see pki.yaml.
    require_peer: 0

  - name: ws
    type: ws_net

  - name: control_http
    type: http
    port: __WS_PORT__
    host_tcp: 1
    routes:
      - path: "/ws"
        websocket_fanout: true
        retain_replay: false
      - path: "/healthz"
        body: "ok"
        content_type: "text/plain"

  - name: dns_http
    type: http
    port: __HTTP_PORT__
    host_tcp: 1
    routes:
      - path: "/service-dns/sign"
        app: true

wiring:
  - from: linux_net.net_out
    to: control_http.net_in
  - from: control_http.net_out
    to: linux_net.net_in
  - from: linux_net.net_out
    to: dns_http.net_in
  - from: dns_http.net_out
    to: linux_net.net_in

  - from: ws.tx_out
    to: control_http.ws_in
    buffer_group: 3
  - from: control_http.ws_out
    to: ws.rx_in
    buffer_group: 4
  - from: control_http.ws_event_out
    to: ws.event_in
  - from: ws.net_out
    to: mux.transport_in
  - from: mux.transport_out
    to: ws.net_in

  # The minter's enrolment seam, and its carriers.
  - from: carrier_mint.identity_req
    to: mux.ch0
  - from: mux.ch1_rx
    to: carrier_mint.identity_cert
  - from: carrier_mint.carrier_out
    to: mux.ch2

  # The signer's keys.
  - from: mux.ch3_rx
    to: service_dns_sign.signing_key
  - from: service_dns_sign.key_announce
    to: mux.ch3
  - from: mux.ch4_rx
    to: service_dns_sign.ca_key

  # The requester: the suite, over HTTP.
  - from: dns_http.request_out
    to: service_dns_sign.request_in
  - from: service_dns_sign.response_out
    to: dns_http.response_in
