version = "0.2.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712"]

[[ports]]
name = "mint_requests"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "tokens"
direction = "output"
content_type = "OctetStream"
buffer_size = 16384
# Envelope (3) + MINT_RESP header (corr 4 + status 1) + token f16 (2 +
# compact JWS). The fixed reserved-claim set is ~800B, but W1/P1 lets a
# request carry custom claims, so the token buffer is sized to 4096 and
# max_record matches to admit a realistically claim-laden token.
max_record = 4096

[[ports]]
name = "key_material"
direction = "input"
content_type = "OctetStream"

# The public half of every signing key, as a VERIFY `MSG_KEY_ADD`.
#
# A signing record names a vault LABEL and carries no key material, so the
# private half is generated inside the vault and the operator distributing
# the record never sees the public half either. This mint is the only
# component that does, which makes announcing it the mint's job. Wire this to
# whatever verifies — `token_verify`, `wellknown_endpoint` — the same way the
# operator's own VERIFY records are wired.
[[ports]]
name = "key_announce"
direction = "output"
content_type = "OctetStream"
max_record = 512

[observability]
metrics = ["mint_ok", "mint_err", "no_key_errors", "sign_ops"]
