version = "0.2.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712"]

# A typed operation: the PROVIDER side of the workspace exchange contract.
# Each request body is one MSG_MINT_REQ envelope and each answer body one
# MSG_MINT_RESP envelope; the exchange id is the correlation. Layouts:
# docs/architecture/typed-operations.md. An answer carries a compact JWS of
# up to 4096 bytes (TOKEN_BUF_LEN in mod.rs) in one record.
[[ports]]
name = "request_in"
direction = "input"
content_type = "ExchangeRequest"
buffer_size = 16384
max_record = 8192

[[ports]]
name = "response_out"
direction = "output"
content_type = "ExchangeResponse"
buffer_size = 16384
max_record = 8192

[[ports]]
name = "key_material"
direction = "input"
content_type = "OctetStream"

# The public half of every signing key, as a VERIFY `MSG_KEY_ADD`.
#
# A signing record names a vault LABEL and carries no key material, so the
# private half is generated inside the vault and the operator distributing
# the record never sees the public half either. This mint is the only
# component that does, which makes announcing it the mint's job. Wire this to
# whatever verifies — `token_verify`, `wellknown_endpoint` — the same way the
# operator's own VERIFY records are wired.
[[ports]]
name = "key_announce"
direction = "output"
content_type = "OctetStream"
# Registry-sized: the widest implemented public key (ML-DSA-87, 2592
# bytes) plus record overhead. Mirrored by ANNOUNCE_MAX_RECORD in mod.rs,
# whose compile-time assertion is what keeps the two from drifting.
max_record = 4096

[observability]
metrics = ["mint_ok", "mint_err", "no_key_errors", "sign_ops"]
