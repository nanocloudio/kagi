version = "0.2.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712"]

[[ports]]
name = "mint_requests"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "tokens"
direction = "output"
content_type = "OctetStream"
buffer_size = 16384
# Envelope (3) + MINT_RESP header (corr 4 + status 1) + token f16 (2 +
# compact JWS). The fixed reserved-claim set is ~800B, but W1/P1 lets a
# request carry custom claims, so the token buffer is sized to 4096 and
# max_record matches to admit a realistically claim-laden token.
max_record = 4096

[[ports]]
name = "key_material"
direction = "input"
content_type = "OctetStream"

[observability]
metrics = ["mint_ok", "mint_err", "no_key_errors", "sign_ops"]
