version = "0.1.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712"]

[[ports]]
name = "request_in"
direction = "input"
content_type = "HttpRequest"
buffer_size = 16384

[[ports]]
name = "response_out"
direction = "output"
content_type = "HttpResponse"
buffer_size = 16384

# The CA's signing seed, in the MSG_KEY_ADD shape every kagi module takes.
[[ports]]
name = "signing_key"
direction = "input"
content_type = "OctetStream"
buffer_size = 512

[observability]
metrics = ["certificate_issued", "certificate_no_key", "certificate_malformed"]

# The CA's public half, as a VERIFY `MSG_KEY_ADD`.
#
# The signing record names a vault LABEL and carries no key material, so the
# private half is generated inside the vault and the operator never sees the
# public half either. This endpoint is the only component that does, which
# makes announcing it its job — wire this to whatever validates the device
# certificates it issues.
[[ports]]
name = "key_announce"
direction = "output"
content_type = "OctetStream"
# Registry-sized ring: this lane carries MSG_KEY_ADD records whose
# key_ref can be the widest implemented public key (ML-DSA-87, 2592
# bytes). 512 fitted the classical suites and silently could not carry a
# post-quantum announcement; the wiring validator refuses a max_record
# above the ring, which is how this class was swept rather than patched.
max_record = 4096
