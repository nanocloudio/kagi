version = "0.1.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712"]

[[ports]]
name = "request_in"
direction = "input"
content_type = "HttpRequest"
buffer_size = 16384

[[ports]]
name = "response_out"
direction = "output"
content_type = "HttpResponse"
buffer_size = 16384

# The verification key device certificates are checked against.
[[ports]]
name = "verify_key"
index = 1
direction = "input"
content_type = "OctetStream"
# Registry-sized ring: this lane carries MSG_KEY_ADD records whose
# key_ref can be the widest implemented public key (ML-DSA-87, 2592
# bytes). 512 fitted the classical suites and silently could not carry a
# post-quantum announcement; the wiring validator refuses a max_record
# above the ring, which is how this class was swept rather than patched.
buffer_size = 8192

[observability]
metrics = [
  "keypkg_unauthenticated",
  "keypkg_wrong_device",
  "package_published",
  "package_claimed_exclusive",
  "package_claimed_last_resort",
  "package_pool_empty",
  "package_pool_full",
  "package_malformed",
]
