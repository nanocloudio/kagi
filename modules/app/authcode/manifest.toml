version = "0.1.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712"]

# The OAuth2/OIDC authorization-code flow. Two operations on one module,
# sharing the client registry, the device ledger and the mint:
#   /authorize     -> AuthorizeRequest  -> AuthorizeResponse (a single-use code)
#   token exchange -> CodeExchangeRequest -> CodeExchangeResponse (access + id)
#
# The subject is established from the device certificate at /authorize, bound
# into the code record, and re-checked at exchange. The pipeline transports
# opaque credentials and never names a subject, an audience, a scope or a
# lifetime (C14) — those are deployment params or issuer-owned.

[[ports]]
name = "requests"
index = 0
direction = "input"
content_type = "OctetStream"
max_record = 4096
buffer_size = 8192

[[ports]]
name = "replies"
index = 0
direction = "output"
content_type = "OctetStream"
max_record = 8192
buffer_size = 16384

# The issuer keyset, as `MSG_KEY_ADD`. A device certificate is verified
# against the key its own header names, so this module holds the same keyset
# the rest of the issuer does.
[[ports]]
name = "verify_key"
index = 1
direction = "input"
content_type = "OctetStream"
buffer_size = 512

# The state adapter, holding the client registry (NS_OAUTH_CLIENT), the
# single-use code records (NS_OAUTH_CODE) and the device ledger (NS_DEVICE).
# REQUIRED: without it a code cannot be created, consumed, or bound to a
# registered client, and a device's revocation status is unknown.
[[ports]]
name = "state_requests"
index = 1
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

[[ports]]
name = "state_replies"
index = 2
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# The mint. REQUIRED: the exchange drives token_mint itself so both the
# access token and the ID token are signed inside kagi over a subject the
# pipeline never handled.
[[ports]]
name = "mint_out"
index = 2
direction = "output"
content_type = "OctetStream"
max_record = 4096
buffer_size = 8192

[[ports]]
name = "mint_in"
index = 3
direction = "input"
content_type = "OctetStream"
buffer_size = 8192

[observability]
metrics = ["authz_ok", "authz_refused", "xchg_ok", "xchg_refused"]
