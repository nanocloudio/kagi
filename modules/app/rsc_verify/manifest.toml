version = "0.1.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712", "linux"]

# A typed operation: the PROVIDER side of the workspace exchange contract.
# Each request body is one `rsc_verify::msg::REQUEST` envelope — CACHE a
# certificate or CRL, or VERIFY a Signed Checklist (RFC 9323) as a tenant's
# evidence that it holds a prefix — and each answer body one `REPLY`
# envelope. Layouts: docs/architecture/typed-operations.md.
[[ports]]
name = "request_in"
direction = "input"
content_type = "ExchangeRequest"
buffer_size = 16384
max_record = 8192

[[ports]]
name = "response_out"
direction = "output"
content_type = "ExchangeResponse"
buffer_size = 16384
max_record = 8192

[observability]
metrics = ["rsc_verified", "rsc_refused", "rsc_cached", "rsc_not_cached"]
