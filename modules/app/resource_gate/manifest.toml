version = "0.1.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712"]

[[ports]]
name = "request_in"
direction = "input"
content_type = "HttpRequest"
buffer_size = 16384

[[ports]]
name = "response_out"
direction = "output"
content_type = "HttpResponse"
buffer_size = 8192

# The issuer's public key, in the same MSG_KEY_ADD shape `token_verify`
# takes. Until one lands every request is refused: a gate that admitted
# while it had nothing to verify against would be a gate in name only.
[[ports]]
name = "verify_key"
direction = "input"
content_type = "OctetStream"
buffer_size = 512

[observability]
metrics = [
  "gate_admitted",
  "gate_no_key",
  "gate_bad_token",
  "gate_bad_proof",
  "gate_not_bound",
  "gate_assurance",
]
