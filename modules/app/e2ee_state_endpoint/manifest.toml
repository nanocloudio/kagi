version = "0.1.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712"]

[[ports]]
name = "request_in"
direction = "input"
content_type = "HttpRequest"
buffer_size = 16384

[[ports]]
name = "response_out"
direction = "output"
content_type = "HttpResponse"
buffer_size = 16384

[observability]
metrics = [
  "state_loaded",
  "state_committed",
  "state_superseded",
  "state_not_advancing",
  "state_rolled_back",
  "state_poisoned",
  "state_table_full",
]
