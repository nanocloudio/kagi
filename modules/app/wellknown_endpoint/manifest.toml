version = "0.1.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712"]

[[ports]]
name = "request_in"
direction = "input"
content_type = "HttpRequest"
buffer_size = 8192

[[ports]]
name = "response_out"
direction = "output"
content_type = "HttpResponse"
buffer_size = 8192

# Public keys and revocations arrive on one control port. Each is a typed
# frame and this module takes both, which is what lets one channel feed two
# concerns without either seeing the other's.
[[ports]]
name = "control"
direction = "input"
content_type = "OctetStream"
buffer_size = 512

[observability]
metrics = [
  "jwks_served",
  "jwks_empty",
  "jwks_not_found",
  "revocation_served",
  "revocation_recorded",
  "revocation_saturated",
]
