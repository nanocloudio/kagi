version = "0.1.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712"]

[[ports]]
name = "request_in"
direction = "input"
content_type = "HttpRequest"
buffer_size = 8192

[[ports]]
name = "response_out"
direction = "output"
content_type = "HttpResponse"
buffer_size = 8192

# Public keys and revocations arrive on one control port. Each is a typed
# frame and this module takes both, which is what lets one channel feed two
# concerns without either seeing the other's.
[[ports]]
name = "control"
direction = "input"
content_type = "OctetStream"
# Registry-sized ring: this lane carries MSG_KEY_ADD records whose
# key_ref can be the widest implemented public key (ML-DSA-87, 2592
# bytes). 512 fitted the classical suites and silently could not carry a
# post-quantum announcement; the wiring validator refuses a max_record
# above the ring, which is how this class was swept rather than patched.
buffer_size = 8192

# The security-state ledger. A revocation marks the device there BEFORE its
# bits reach the published document, because the document is a projection of
# the ledger and not the authority: minting consults the ledger, and a
# revocation that only ever reached the filter would be one the mint never
# hears about.
[[ports]]
name = "state_out"
index = 1
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

[[ports]]
name = "state_in"
index = 2
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

[observability]
metrics = [
  "jwks_served",
  "jwks_empty",
  "jwks_not_found",
  "revocation_served",
  "revocation_recorded",
  "revocation_uncommitted",
  "revocation_saturated",
]
