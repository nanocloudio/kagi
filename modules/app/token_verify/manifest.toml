version = "0.1.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712"]

# A typed operation: the PROVIDER side of the workspace exchange contract.
# Each request body is one MSG_VERIFY_REQ envelope and each answer body one
# MSG_VERIFY_RESP envelope; the exchange id is the correlation. Layouts:
# docs/architecture/typed-operations.md.
[[ports]]
name = "request_in"
direction = "input"
content_type = "ExchangeRequest"
buffer_size = 16384
max_record = 8192

[[ports]]
name = "response_out"
direction = "output"
content_type = "ExchangeResponse"
buffer_size = 16384
max_record = 8192

[[ports]]
name = "verify_key"
direction = "input"
content_type = "OctetStream"

[observability]
metrics = ["verify_ok", "verify_bad_sig", "verify_expired", "verify_malformed", "no_key_errors"]
