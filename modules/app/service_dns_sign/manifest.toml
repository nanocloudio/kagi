version = "0.1.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712", "linux"]

# A typed operation: the PROVIDER side of the workspace exchange contract.
# Each request body is one `service_dns::msg::REQUEST` envelope (an unsigned
# the traffic fabric's `service_dns` projection and the publisher's cert-bound carrier)
# and each answer body one `REPLY` envelope: the signed KSDN record, or a
# typed refusal. Only a publisher the graph pins to the projection's service
# is signed for. Layouts: docs/architecture/control-acts.md.
[[ports]]
name = "request_in"
direction = "input"
content_type = "ExchangeRequest"
buffer_size = 16384
max_record = 8192

[[ports]]
name = "response_out"
direction = "output"
content_type = "ExchangeResponse"
buffer_size = 16384
max_record = 8192

# The SERVICE_DNS signing key, in the MSG_KEY_ADD shape every kagi module
# takes: a vault label, never key material.
[[ports]]
name = "signing_key"
direction = "input"
content_type = "OctetStream"
buffer_size = 512

# The certificate authority's public key: the anchor a publisher's leaf
# chains to.
[[ports]]
name = "ca_key"
direction = "input"
content_type = "OctetStream"
buffer_size = 512

# The signing key's public half, as a VERIFY MSG_KEY_ADD, for every
# `service_dns` consumer in the deployment.
[[ports]]
name = "key_announce"
direction = "output"
content_type = "OctetStream"
buffer_size = 512
max_record = 512

[observability]
metrics = ["dns_signed", "dns_refused", "dns_unauthenticated", "dns_no_key"]
