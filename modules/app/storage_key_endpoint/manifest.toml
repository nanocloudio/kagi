version = "0.1.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712"]

# The storage-key service's network edge (modules/common/storage_key_endpoint.rs):
# `POST /storage-key`, one REQUEST payload in the body, the REPLY payload back.
# Only a challenge, an attach, a recovery and a renewal pass — the operations
# that carry a node's own proof; every control verb is refused 403 and reaches
# the service only on an edge inside the control plane's graph.
#
# The service's answers fan out to every requester wired to it. Each answer
# names the exchange its requester opened, and this endpoint answers only the
# ones it opened.

# Requests from `http.request_out`: this endpoint is a PROVIDER of the
# workspace exchange contract.
[[ports]]
name = "request_in"
direction = "input"
content_type = "ExchangeRequest"
buffer_size = 16384

# Answers to `http.response_in`.
[[ports]]
name = "response_out"
direction = "output"
content_type = "ExchangeResponse"
buffer_size = 16384

# Calls to `storage_key.request_in`: this endpoint is the REQUESTER of the
# service's exchange, one exchange per admitted request.
[[ports]]
name = "service_out"
direction = "output"
index = 1
content_type = "ExchangeRequest"
buffer_size = 16384
max_record = 8192

# Answers from `storage_key.response_out`.
[[ports]]
name = "service_in"
direction = "input"
index = 1
content_type = "ExchangeResponse"
buffer_size = 16384
max_record = 8192

[observability]
exempt = "edge — every decision it carries is the service's, audited in its ledger"
