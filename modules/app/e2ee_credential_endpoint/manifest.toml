version = "0.1.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712"]

[[ports]]
name = "request_in"
direction = "input"
content_type = "HttpRequest"
buffer_size = 16384

[[ports]]
name = "response_out"
direction = "output"
content_type = "HttpResponse"
buffer_size = 16384

# The signing seed, in the MSG_MINT_KEY shape every kagi module takes.
[[ports]]
name = "signing_key"
direction = "input"
content_type = "OctetStream"
buffer_size = 512

# Reads against the device directory: which device is enrolled, and which
# key it enrolled with.
[[ports]]
name = "directory_out"
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

[[ports]]
name = "directory_in"
direction = "input"
content_type = "OctetStream"
buffer_size = 8192

[observability]
metrics = [
  "credential_issued",
  "credential_no_key",
  "credential_malformed",
  "credential_unknown_device",
  "credential_bad_possession",
  "credential_in_flight_full",
]
