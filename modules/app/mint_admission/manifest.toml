version = "0.1.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712"]

# A typed operation: the PROVIDER side of the workspace exchange contract.
# Each request body is one MSG_ADMIT_REQ or MSG_GRANT_REQ envelope and each
# answer body one MSG_ADMIT_RESP or MSG_GRANT_RESP envelope; the exchange id
# is the correlation. Layouts: docs/architecture/typed-operations.md.
[[ports]]
name = "request_in"
index = 0
direction = "input"
content_type = "ExchangeRequest"
buffer_size = 16384
max_record = 8192

[[ports]]
name = "response_out"
index = 0
direction = "output"
content_type = "ExchangeResponse"
buffer_size = 16384
max_record = 8192

# The issuer keyset, as `MSG_KEY_ADD`. A device certificate is checked
# against the key its own header names, so this module holds the same keyset
# the rest of the issuer does.
[[ports]]
name = "verify_key"
index = 1
direction = "input"
content_type = "OctetStream"
# Registry-sized ring: this lane carries MSG_KEY_ADD records whose
# key_ref can be the widest implemented public key (ML-DSA-87, 2592
# bytes). 512 fitted the classical suites and silently could not carry a
# post-quantum announcement; the wiring validator refuses a max_record
# above the ring, which is how this class was swept rather than patched.
buffer_size = 8192

# The device ledger. Admission REFUSES TO CONSTRUCT without it: enrolment
# and revocation are both unknown otherwise, and issuing without knowing
# whether a device is revoked is the defect this module exists to close.
[[ports]]
name = "state_requests"
index = 1
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

[[ports]]
name = "state_replies"
index = 2
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

[observability]
metrics = ["admit_ok", "admit_unauthenticated", "admit_unknown_device", "admit_revoked", "admit_replay", "admit_unavailable", "grant_ok", "grant_mint_failed"]

# Grant mode (the /oauth/token slice): admission drives the mint itself so a
# subject established here never passes through the untrusted pipeline. On
# these ports this module is the REQUESTER of `token_mint`'s exchange: one
# POST per grant, body a MSG_MINT_REQ envelope, answer a MSG_MINT_RESP. They
# are OPTIONAL — a graph using admission for bare admit wires neither, and a
# GrantRequest arriving with no mint wired is refused MINT_FAILED rather
# than dropped.
[[ports]]
name = "mint_out"
index = 2
direction = "output"
content_type = "ExchangeRequest"
buffer_size = 16384
max_record = 8192

[[ports]]
name = "mint_in"
index = 3
direction = "input"
content_type = "ExchangeResponse"
buffer_size = 16384
max_record = 8192
