version = "0.1.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712"]

[[ports]]
name = "admit_requests"
index = 0
direction = "input"
content_type = "OctetStream"
max_record = 4096
buffer_size = 8192

[[ports]]
name = "admit_replies"
index = 0
direction = "output"
content_type = "OctetStream"
max_record = 1024

# The issuer keyset, as `MSG_KEY_ADD`. A device certificate is checked
# against the key its own header names, so this module holds the same keyset
# the rest of the issuer does.
[[ports]]
name = "verify_key"
index = 1
direction = "input"
content_type = "OctetStream"
buffer_size = 512

# The device ledger. Admission REFUSES TO CONSTRUCT without it: enrolment
# and revocation are both unknown otherwise, and issuing without knowing
# whether a device is revoked is the defect this module exists to close.
[[ports]]
name = "state_requests"
index = 1
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

[[ports]]
name = "state_replies"
index = 2
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

[observability]
metrics = ["admit_ok", "admit_unauthenticated", "admit_unknown_device", "admit_revoked", "admit_replay", "admit_unavailable", "grant_ok", "grant_mint_failed"]

# Grant mode (the /oauth/token slice): admission drives the mint itself so a
# subject established here never passes through the untrusted pipeline. These
# ports are OPTIONAL — a graph using admission for bare admit (token_endpoint)
# wires neither, and a GrantRequest arriving with no mint wired is refused
# MINT_FAILED rather than dropped.
[[ports]]
name = "mint_out"
index = 2
direction = "output"
content_type = "OctetStream"
max_record = 4096
buffer_size = 8192

[[ports]]
name = "mint_in"
index = 3
direction = "input"
content_type = "OctetStream"
buffer_size = 8192
